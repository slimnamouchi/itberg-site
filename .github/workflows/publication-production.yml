# À chaque fusion sur main : vérifie le site, le publie sur itberg.tn,
# puis prévient Bing et les autres moteurs IndexNow que les pages ont changé.
name: Publication en production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publier:
    # Machine qui fait tourner la publication. Par défaut : les machines de GitHub
    # (gratuites et illimitées si le dépôt est public). Pour utiliser un runner à vous,
    # créez la variable RUNNER_LABELS (Settings → Secrets and variables → Actions → Variables),
    # par exemple ["self-hosted","macOS"]. Voir NOTICE.md.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier le site
        run: python3 scripts/check_site.py
      - name: Publier sur Firebase Hosting (itberg.tn)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
      - name: Prévenir les moteurs (IndexNow)
        continue-on-error: true
        run: python3 scripts/indexnow.py
