# Sur chaque pull request : vérifie le site et publie un aperçu temporaire (7 jours).
# L'adresse de l'aperçu est ajoutée automatiquement en commentaire de la pull request.
name: Aperçu de la pull request

on: pull_request

# Aucun droit par défaut : chaque tâche reçoit seulement ce dont elle a besoin.
permissions: {}

# Une seule publication d'aperçu à la fois par pull request.
concurrency:
  group: apercu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apercu:
    # Les pull requests venant d'un fork n'ont pas accès au secret Firebase.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # Machine qui fait tourner la publication. Par défaut : les machines de GitHub
    # (gratuites et illimitées si le dépôt est public). Pour utiliser un runner à vous,
    # créez la variable RUNNER_LABELS (Settings → Secrets and variables → Actions → Variables),
    # par exemple ["self-hosted","macOS"]. Voir NOTICE.md.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Vérifier le site
        run: python3 scripts/check_site.py
      - name: Publier l'aperçu sur Firebase
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d
