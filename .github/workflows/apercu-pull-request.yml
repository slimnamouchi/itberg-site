# Sur chaque pull request : vérifie le site et publie un aperçu temporaire (7 jours).
# L'adresse de l'aperçu est ajoutée automatiquement en commentaire de la pull request.
name: Aperçu de la pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  apercu:
    # Les pull requests venant d'un fork n'ont pas accès au secret Firebase.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # Tourne sur le runner GitHub installé sur le Mac (gratuit). Voir NOTICE.md.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier le site
        run: python3 scripts/check_site.py
      - name: Publier l'aperçu sur Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d
